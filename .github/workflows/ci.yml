name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Run the test suite
        run: uv run python -m unittest discover -s tests -v

      - name: Confirm the suite did not hang
        run: uv run python -c "import main; print('import ok')"

      # The package exists so that nothing generic lands in site-packages; a
      # packaging slip would ship that silently with a green test job.
      - name: Confirm no top-level modules ship in the wheel
        run: |
          uv build
          uv run python - <<'PY'
          import glob
          import zipfile

          wheel = sorted(glob.glob("dist/*.whl"))[-1]
          names = zipfile.ZipFile(wheel).namelist()
          top_level = [n for n in names if n.endswith(".py") and "/" not in n]
          assert not top_level, f"top-level modules in wheel: {top_level}"
          print("packaged:", sorted(n for n in names if n.startswith("strix_battery/")))
          PY

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Run ruff
        run: uv run --group dev ruff check .

      - name: Run ruff format check
        run: uv run --group dev ruff format --check .

      - name: Run ty
        run: uv run --group dev ty check
